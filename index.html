<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>FamilyHub</title>
<meta name="theme-color" content="#2E7D52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilyHub">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232E7D52'/%3E%3Ctext x='90' y='124' font-size='94' text-anchor='middle'%3E%F0%9F%8D%BD%3C/text%3E%3C/svg%3E">
<style>
  *{ -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#F3F7F3; overscroll-behavior-y:none; }
  body { font-family: system-ui, -apple-system, "SF Pro Text", sans-serif; }
  #root { min-height:100vh; min-height:100dvh; }
  #root > div { padding-top: env(safe-area-inset-top); }
  input, textarea, select, button { font-size:16px; font-family:inherit; }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:linear-gradient(135deg,#2E7D52,#3DAA6E); color:#fff; z-index:9999; }
  #boot p { margin:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sp { width:34px; height:34px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff;
        border-radius:50%; animation:spin .8s linear infinite; margin-top:22px; }
</style>
</head>
<body>
<div id="boot">
  <p style="font-size:60px;line-height:1">&#128106;</p>
  <p style="font-size:26px;font-weight:800;margin-top:10px;letter-spacing:-.5px">FamilyHub</p>
  <p style="font-size:13px;opacity:.8;margin-top:6px">wird geladen &hellip;</p>
  <div class="sp"></div>
</div>
<div id="root"></div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("boot");
  if (b) b.innerHTML = '<p style="font-size:44px">&#9888;</p>' +
    '<p style="font-size:17px;font-weight:700;margin-top:10px">Fehler beim Laden</p>' +
    '<p style="font-size:12px;opacity:.85;margin-top:8px;padding:0 30px;text-align:center">' +
    (e.message||"Unbekannt") + '</p>';
});
</script>
