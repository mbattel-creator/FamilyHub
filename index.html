<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>FamilyHub</title>
<meta name="theme-color" content="#2E7D52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilyHub">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232E7D52'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle'%3E%F0%9F%91%A8%E2%80%8D%F0%9F%91%A9%E2%80%8D%F0%9F%91%A7%3C/text%3E%3C/svg%3E">
<style>
  *{ -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#F3F7F3; overscroll-behavior-y: none; }
  body { font-family: system-ui, -apple-system, "SF Pro Text", sans-serif; }
  #root { min-height: 100vh; min-height: 100dvh; }
  /* Safe Area fuer iPhone mit Notch / Dynamic Island */
  #root > div { padding-top: env(safe-area-inset-top); }
  input, textarea, select, button { font-family: inherit; font-size: 16px; }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:linear-gradient(135deg,#2E7D52,#3DAA6E); color:#fff; z-index:9999; }
  #boot p { margin:0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sp { width:34px; height:34px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff;
        border-radius:50%; animation:spin .8s linear infinite; margin-top:22px; }
</style>
</head>
<body>
<div id="boot">
  <p style="font-size:62px;line-height:1">👨‍👩‍👧‍👦</p>
  <p style="font-size:26px;font-weight:800;margin-top:10px;letter-spacing:-.5px">FamilyHub</p>
  <p style="font-size:13px;opacity:.8;margin-top:6px">wird geladen …</p>
  <div class="sp"></div>
</div>
<div id="root"></div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("boot");
  if (b) b.innerHTML = '<p style="font-size:46px">⚠️</p>' +
    '<p style="font-size:18px;font-weight:700;margin-top:10px">Fehler beim Laden</p>' +
    '<p style="font-size:12px;opacity:.85;margin-top:8px;padding:0 30px;text-align:center">' +
    (e.message || "Unbekannt") + '</p>';
});
</script>
